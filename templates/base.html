<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}SportsAid{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container row">
      <div class="brand">
        <div class="logo-dot" aria-hidden="true"></div>
        <a href="{{ url_for('index') }}" class="brand-title">SportsAid</a>
      </div>
      <nav class="nav">
        <a href="{{ url_for('index') }}" aria-current="page">Home</a>
        <a href="#" aria-disabled="true">Markets</a>
        <a href="#" aria-disabled="true">Trends</a>
        <a href="#" aria-disabled="true">My Card</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container row">
      <p class="muted">© {{ current_year }} SportsAid. For informational purposes only. Not gambling advice.</p>
      <div class="footer-links">
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
      </div>
    </div>
  </footer>
</body>
</html>
