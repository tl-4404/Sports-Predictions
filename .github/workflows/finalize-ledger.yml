name: Finalize append-only ledger

on:
  push:
    branches:
      - agent/mlb-v5-merged-audits
    paths:
      - tools/remove_ledger_crypto.py

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply non-cryptographic ledger migration
        run: python tools/remove_ledger_crypto.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile pipeline modules
        run: python -m py_compile mlb/db.py mlb/decision.py mlb/simulator.py mlb/calibration.py mlb/predict.py mlb/grade.py mlb/llm_saved_pipeline.py mlb/llm_chat_runner.py
      - name: Run targeted merged-audit tests
        run: |
          python tests/test_merged_audit_policy.py
          python tests/test_llm_chat_pipeline.py
          python tests/test_accuracy_policy.py
      - name: Run full offline suite
        run: make test
      - name: Commit finalized pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Remove ledger cryptography and finalize merged MLB audit" || exit 0
          git push origin HEAD:agent/mlb-v5-merged-audits
