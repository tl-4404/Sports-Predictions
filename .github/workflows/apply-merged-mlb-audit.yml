name: Apply merged MLB audit

on:
  push:
    branches:
      - agent/mlb-v5-merged-audits
    paths:
      - tools/apply_merged_audit.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply consolidated payload
        run: python tools/apply_merged_audit.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile changed modules
        run: python -m py_compile mlb/decision.py mlb/db.py mlb/simulator.py mlb/calibration.py mlb/predict.py mlb/grade.py mlb/policy_flags.py mlb/llm_saved_pipeline.py mlb/llm_chat_runner.py
      - name: Run merged audit regressions
        run: |
          python tests/test_merged_audit_policy.py
          python tests/test_llm_chat_pipeline.py
          python tests/test_accuracy_policy.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Implement consolidated MLB v4.2 and v5 audits"
            git push origin HEAD:agent/mlb-v5-merged-audits
          fi
